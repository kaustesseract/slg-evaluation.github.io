<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASL Screening</title>
  <style>

:root{
  --monash:#0057b8;
  --monash-dark:#003a78;
  --sky:#13a8d8;
  --violet:#7c3aed;
  --magenta:#d946ef;
  --amber:#f59e0b;
  --success:#138a5b;
  --ink:#0f172a;
  --muted:#475569;
  --soft:#f8fafc;
  --panel:rgba(255,255,255,.92);
  --panel-strong:#ffffff;
  --line:rgba(15,23,42,.12);
  --shadow:0 28px 80px rgba(15,23,42,.16);
  --shadow-soft:0 16px 44px rgba(15,23,42,.10);
  --radius-xl:34px;
  --radius-lg:24px;
  --radius-md:16px;
  --focus:0 0 0 4px rgba(0,87,184,.22);
}

*{box-sizing:border-box;}

html{scroll-behavior:smooth;}

body{
  margin:0;
  min-height:100vh;
  font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 8% 12%, rgba(19,168,216,.24), transparent 32%),
    radial-gradient(circle at 92% 6%, rgba(124,58,237,.22), transparent 30%),
    radial-gradient(circle at 80% 90%, rgba(245,158,11,.20), transparent 34%),
    linear-gradient(135deg,#eef7ff 0%,#f8fbff 48%,#fff7ed 100%);
  padding:30px;
  position:relative;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(15,23,42,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(15,23,42,.045) 1px, transparent 1px);
  background-size:34px 34px;
  mask-image:linear-gradient(to bottom, rgba(0,0,0,.75), rgba(0,0,0,.18));
}

body::after{
  content:"";
  position:fixed;
  width:420px;
  height:420px;
  right:-120px;
  bottom:-150px;
  border-radius:50%;
  background:linear-gradient(135deg, rgba(0,87,184,.18), rgba(217,70,239,.16));
  filter:blur(8px);
  pointer-events:none;
}

button,input,textarea,select{font:inherit;}

a{color:inherit;}

.app-shell,.page{
  width:min(1120px,100%);
  margin:0 auto;
  position:relative;
  z-index:1;
}

.app-shell.centered,.home-shell{
  min-height:calc(100vh - 60px);
  display:grid;
  place-items:center;
}

.home-panel,.container,.screening-panel,.evaluation-panel,.header-panel,.content-card,.selection-panel,.completion-card{
  width:min(1080px,100%);
  margin:0 auto;
  background:var(--panel);
  border:1px solid rgba(255,255,255,.78);
  border-radius:var(--radius-xl);
  box-shadow:var(--shadow);
  backdrop-filter:blur(18px);
  position:relative;
  overflow:hidden;
}

.home-panel,.container,.screening-panel,.evaluation-panel,.selection-panel,.completion-card{
  padding:38px;
}

.home-panel::before,.container::before,.screening-panel::before,.evaluation-panel::before,.content-card::before,.completion-card::before{
  content:"";
  position:absolute;
  inset:0;
  background:url("Arms_of_Monash_University.svg") center 45% no-repeat;
  background-size:min(620px,74vw);
  opacity:.045;
  pointer-events:none;
}

.home-panel::after,.container::after,.screening-panel::after,.evaluation-panel::after,.content-card::after,.completion-card::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(135deg, rgba(0,87,184,.12), transparent 34%),
    linear-gradient(315deg, rgba(217,70,239,.10), transparent 34%);
  pointer-events:none;
}

.content,.panel-content,.home-panel > *, .screening-panel > *, .evaluation-panel > *, .container > *, .content-card > *, .completion-card > *{
  position:relative;
  z-index:1;
}

.brand-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  margin-bottom:28px;
}

.brand-left{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo-tile{
  width:56px;
  height:56px;
  border-radius:18px;
  background:rgba(255,255,255,.88);
  display:grid;
  place-items:center;
  box-shadow:var(--shadow-soft);
  border:1px solid rgba(15,23,42,.08);
  flex:0 0 auto;
}

.logo-tile img{width:38px;height:38px;object-fit:contain;}

.brand-title{font-weight:900;color:var(--ink);line-height:1.15;}
.brand-subtitle{font-size:13px;color:var(--muted);font-weight:800;margin-top:3px;}

.project-pill,.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  min-height:34px;
  padding:7px 13px;
  border-radius:999px;
  color:var(--monash-dark);
  background:linear-gradient(135deg, rgba(219,234,254,.92), rgba(245,243,255,.94));
  border:1px solid rgba(0,87,184,.16);
  font-size:13px;
  font-weight:900;
  letter-spacing:.02em;
}

.eyebrow::before,.project-pill::before{
  content:"";
  width:9px;
  height:9px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--monash),var(--magenta));
  box-shadow:0 0 0 4px rgba(0,87,184,.12);
}

h1{
  margin:12px 0 14px;
  font-size:clamp(34px,5.6vw,68px);
  line-height:.98;
  letter-spacing:-.055em;
  color:var(--ink);
}

h1 .accent, .gradient-text{
  background:linear-gradient(110deg,var(--monash) 0%,var(--sky) 38%,var(--violet) 72%,var(--magenta) 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

h2{
  margin:0 0 14px;
  font-size:clamp(26px,3.2vw,40px);
  line-height:1.1;
  letter-spacing:-.025em;
}

h3{margin:0 0 12px;font-size:20px;line-height:1.25;color:var(--ink);}

.subtitle,.lead,.instruction,.ready,p,li{
  color:var(--muted);
  line-height:1.65;
}

.lead,.subtitle{font-size:clamp(17px,2vw,22px);font-weight:700;max-width:820px;}

.lead.center,.subtitle.center{text-align:center;margin-left:auto;margin-right:auto;}

.section-title{text-align:center;margin-bottom:24px;}
.section-title .eyebrow{margin-bottom:12px;}

.menu,.menu-grid,.language-menu,.actions{
  display:flex;
  flex-wrap:wrap;
  gap:16px;
  align-items:center;
  justify-content:center;
}

.menu,.menu-grid,.language-menu{margin-top:34px;}

.menu a,.menu-card,.language-menu a,.button,button,.back-link{
  min-height:52px;
  border:0;
  border-radius:18px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:14px 22px;
  text-decoration:none;
  background:linear-gradient(135deg,var(--monash),var(--sky));
  color:#fff;
  font-weight:900;
  font-size:17px;
  box-shadow:0 14px 30px rgba(0,87,184,.28);
  transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
  cursor:pointer;
}

.menu a:hover,.menu a:focus,.menu-card:hover,.menu-card:focus,.language-menu a:hover,.language-menu a:focus,.button:hover,.button:focus,button:hover,button:focus,.back-link:hover,.back-link:focus{
  transform:translateY(-2px);
  filter:saturate(1.06);
  box-shadow:0 20px 42px rgba(0,87,184,.34);
  outline:none;
}

.menu a:focus-visible,.menu-card:focus-visible,.language-menu a:focus-visible,.button:focus-visible,button:focus-visible,.back-link:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
  outline:none;
  box-shadow:var(--focus),0 20px 42px rgba(0,87,184,.28);
}

.button.secondary,.back-link,.menu a.secondary,.secondary{
  background:rgba(255,255,255,.9);
  color:var(--ink);
  border:1px solid rgba(15,23,42,.12);
  box-shadow:0 10px 24px rgba(15,23,42,.10);
}

.button.ghost{
  background:rgba(255,255,255,.55);
  color:var(--monash-dark);
  border:1px solid rgba(0,87,184,.16);
  box-shadow:none;
}

.success{color:var(--success);font-weight:900;}

.info-strip{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
  margin-top:34px;
}

.info-card,.question,.question-card,.notice,.important-note{
  background:rgba(255,255,255,.74);
  border:1px solid rgba(15,23,42,.10);
  border-radius:var(--radius-md);
  padding:18px 20px;
  box-shadow:0 10px 28px rgba(15,23,42,.06);
}

.info-card strong{display:block;color:var(--ink);font-size:15px;margin-bottom:4px;}
.info-card span{color:var(--muted);font-size:14px;font-weight:700;}

form{margin-top:26px;}
.question{margin-top:16px;}
.question h3{color:var(--monash-dark);}

label{
  color:var(--ink);
  font-weight:750;
}

.choice-list label,.question label{
  display:flex;
  align-items:flex-start;
  gap:10px;
  margin:10px 0;
  padding:12px 14px;
  border-radius:14px;
  background:rgba(255,255,255,.72);
  border:1px solid rgba(15,23,42,.08);
  transition:background .15s ease,border-color .15s ease,transform .15s ease;
}

.choice-list label:hover,.question label:hover{
  background:#fff;
  border-color:rgba(0,87,184,.22);
  transform:translateX(2px);
}

input[type="radio"]{margin-top:3px;accent-color:var(--monash);}

input[type="text"],textarea,select{
  width:100%;
  border:1px solid rgba(15,23,42,.15);
  border-radius:16px;
  background:rgba(255,255,255,.92);
  color:var(--ink);
  padding:14px 16px;
  font-size:16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
}

textarea{min-height:120px;resize:vertical;}

button:disabled{opacity:.68;cursor:not-allowed;filter:grayscale(.2);}

.participant strong,.participant-code{
  display:inline-flex;
  max-width:100%;
  margin-top:10px;
  padding:10px 14px;
  border-radius:14px;
  background:rgba(15,23,42,.05);
  color:var(--monash-dark);
  overflow-wrap:anywhere;
}

.video-stage,.video-wrap{
  width:min(560px,100%);
  margin:24px auto 14px;
}

.video-wrap{
  border-radius:26px;
  padding:12px;
  background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(239,246,255,.86));
  border:1px solid rgba(15,23,42,.12);
  box-shadow:0 20px 48px rgba(15,23,42,.18);
}

video{
  width:100%;
  display:block;
  border-radius:18px;
  background:#0b1220;
  max-height:440px;
}

.video-count{
  display:inline-flex;
  padding:8px 12px;
  border-radius:999px;
  margin:10px 0 24px;
  background:rgba(0,87,184,.10);
  color:var(--monash-dark);
  font-weight:900;
}

.answer-box{width:min(640px,100%);margin:0 auto;display:grid;gap:14px;}
.answer-box > label{font-size:20px;font-weight:900;text-align:center;}

.speed-row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  margin:0 0 24px;
}
.speed-row select{width:auto;min-width:120px;}

.question-card{margin-bottom:16px;}
.question-title{font-weight:900;color:var(--ink);font-size:18px;margin:0 0 8px;}
.scale-help{font-size:14px;color:var(--muted);font-weight:700;margin:0 0 12px;}
.slider-row{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;}
input[type="range"]{width:100%;accent-color:var(--monash);}
.rating-value{min-width:54px;padding:8px 12px;border-radius:14px;background:linear-gradient(135deg,var(--monash),var(--violet));color:white;text-align:center;font-weight:900;}
.scale-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:800;margin-top:6px;}
.message{min-height:24px;text-align:center;color:var(--muted);font-weight:850;}
.complete{font-size:22px;color:var(--success);}
.hidden{display:none!important;}

.content-card{padding:34px;margin-top:24px;}
.content-card p,.content-card li{font-size:17px;}
.important-note{border-left:6px solid var(--amber);background:rgba(255,251,235,.82);}
.notice{border-left:6px solid var(--monash);}
footer{position:relative;z-index:1;text-align:center;margin:20px 0 0;color:var(--muted);font-weight:700;font-size:14px;}

.progress-row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin:0 0 26px;
}
.progress-step{
  min-height:8px;
  border-radius:999px;
  background:rgba(15,23,42,.10);
  overflow:hidden;
}
.progress-step.active{background:linear-gradient(90deg,var(--monash),var(--sky));}

@media (max-width:820px){
  body{padding:18px;}
  .home-panel,.container,.screening-panel,.evaluation-panel,.selection-panel,.completion-card,.content-card{padding:24px;border-radius:24px;}
  .brand-row{align-items:flex-start;flex-direction:column;}
  .info-strip{grid-template-columns:1fr;}
  .menu,.menu-grid,.language-menu,.actions{display:grid;grid-template-columns:1fr;width:100%;}
  .menu a,.menu-card,.language-menu a,.button,button,.back-link{width:100%;}
  .slider-row{grid-template-columns:1fr;}
  .rating-value{justify-self:center;}
  h1{font-size:clamp(32px,11vw,50px);}
}

  </style>
</head>
<body>
  <main class="app-shell">
    <section class="screening-panel">
      <div class="brand-row">
  <div class="brand-left">
    <div class="logo-tile"><img src="Arms_of_Monash_University.svg" alt="Monash University logo"></div>
    <div>
      <div class="brand-title">Monash University</div>
      <div class="brand-subtitle">3D Fingerspelling Evaluation Dataset</div>
    </div>
  </div>
  <div class="project-pill">Project ID 52521</div>
</div>
      <div class="progress-row" aria-label="Progress">
        <div class="progress-step active"></div><div class="progress-step active"></div><div class="progress-step"></div><div class="progress-step"></div>
      </div>
      <div class="section-title">
        <span class="eyebrow">Step 2 of 4</span>
        <h1>Screening <span class="gradient-text">Task</span></h1>
        <p class="instruction">American Sign Language</p>
      </div>
      <div class="video-stage">
        <div class="video-wrap">
          <video id="screening-video" controls playsinline preload="metadata">
            <source id="video-source" src="asl_hello.mp4" type="video/mp4">
            Your browser does not support the video tag.
          </video>
        </div>
      </div>
      <p class="video-count" id="video-count">Video 1 of 2</p>
      <form class="answer-box" id="screening-form">
        <label for="sign-answer">What is this sign?</label>
        <input id="sign-answer" name="sign-answer" type="text" autocomplete="off" placeholder="Enter the sign name here">
        <button class="submit-button" type="submit">Submit</button>
        <p class="message" id="form-message" aria-live="polite"></p>
      </form>
      <div class="actions">
        <a class="button secondary" href="screening-language.html">Back to Language Selection</a>
      </div>
    </section>
  </main>
<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyYlYzG2xq1zm9Cy5_gGArUed5WFIO7y9k2iPrj400YL_aSSHm8EgLhZtZK3uYmjUIl/exec";
    const videos = [
      { file: "asl_hello.mp4", label: "Video 1" },
      { file: "asl_goodbye.mp4", label: "Video 2" }
    ];

    sessionStorage.setItem("selected_language", "ASL");
    sessionStorage.setItem("screening_complete", "false");

    const form = document.getElementById("screening-form");
    const answerInput = document.getElementById("sign-answer");
    const message = document.getElementById("form-message");
    const video = document.getElementById("screening-video");
    const videoSource = document.getElementById("video-source");
    const videoCount = document.getElementById("video-count");
    const submitButton = form.querySelector(".submit-button");

    let currentVideoIndex = 0;

    function getParticipantId() {
      const existingId = sessionStorage.getItem("participant_id");
      if (existingId) {
        return existingId;
      }

      const newId = crypto.randomUUID
        ? crypto.randomUUID()
        : `participant-${Date.now()}-${Math.random().toString(16).slice(2)}`;

      sessionStorage.setItem("participant_id", newId);
      return newId;
    }

    function showCurrentVideo() {
      const currentVideo = videos[currentVideoIndex];
      video.pause();
      videoSource.src = currentVideo.file;
      video.load();
      videoCount.textContent = `Video ${currentVideoIndex + 1} of ${videos.length}`;
      answerInput.value = "";
      message.textContent = "";
      answerInput.focus();
    }

    function sendScreeningResponse(payload) {
      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        body: payload
      }).catch((error) => {
        console.error("Screening submission failed:", error);
      });
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const answer = answerInput.value.trim();
      if (!answer) {
        message.textContent = "Please enter your answer before submitting.";
        answerInput.focus();
        return;
      }

      const payload = new FormData();
      payload.append("participant_id", getParticipantId());
      payload.append("language", "American Sign Language");
      payload.append("question", "What is this sign?");
      payload.append("video", videos[currentVideoIndex].file);
      payload.append("response", answer);

      sendScreeningResponse(payload);

      if (currentVideoIndex < videos.length - 1) {
        currentVideoIndex += 1;
        showCurrentVideo();
        message.textContent = "Response submitted. Please answer the next video.";
      } else {
        message.textContent = "All screening responses submitted. Redirecting...";
        sessionStorage.setItem("screening_complete", "true");
        answerInput.disabled = true;
        submitButton.disabled = true;
        submitButton.textContent = "Screening Complete";

        setTimeout(() => {
          window.location.href = "screening-completed.html";
        }, 500);
      }
    });

    showCurrentVideo();
  </script>
</body>
</html>
